name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version de Swift
        run: swift --version
      - name: Tests
        run: swift test
      - name: Assemblage de l'app
        run: ./scripts/bundle.sh
